<style>
:root{--bg:#000;--s1:#0d0d0d;--s2:#1e1e1e;--ln:#2b2b2b;--fg:#fff;--mu:#8c8c8c;--hd:'Inter Tight',system-ui,sans-serif;--lb:'Space Grotesk',system-ui,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--hd);font-size:15px;line-height:1.4;display:flex;justify-content:center}
button,input{font:inherit;color:inherit;background:none;border:0}button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
#app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:#000}
@media (min-width:520px){body{background:#000;align-items:center}#app{height:min(880px,calc(100% - 32px));border-radius:36px;border:1px solid var(--ln)}}
main{flex:1;overflow-y:auto;padding:20px 20px 110px;scrollbar-width:none}main::-webkit-scrollbar{display:none}
h1{font-weight:800;font-size:38px;letter-spacing:-.045em;line-height:1}
h2{font-weight:700;font-size:19px;letter-spacing:-.02em}
.mu{color:var(--mu)}
.lbl,.date,.pill,.chip,nav button,.chips b,.n{font-family:var(--lb)}
.lbl,.date{text-transform:uppercase;letter-spacing:.12em;font-size:11.5px;color:var(--mu)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.pill{border:1px solid var(--ln);border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:24px;padding:20px}
.cta{width:100%;height:56px;border-radius:99px;background:#fff;color:#000;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:9px}
.cta:active{transform:scale(.98)}.cta.g{background:none;border:1.5px solid var(--ln);color:#fff}.cta.s{height:44px;font-size:15px;width:auto;padding:0 18px}
.srch{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:0 14px;height:50px;margin:16px 0 12px}
.srch input{flex:1;height:100%;outline:0}.srch input::placeholder{color:var(--mu)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 16px;padding:0 20px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--ln);border-radius:99px;padding:0 16px;min-height:40px;font-size:14px;font-weight:500;color:var(--mu)}
.chip.on{background:#fff;color:#000;border-color:#fff;font-weight:600}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px;margin-bottom:10px;background:var(--s1);border:1px solid var(--ln);border-radius:20px;min-height:76px}
.th{width:56px;height:56px;flex:none;background:var(--s2);border-radius:14px;padding:4px}
.row .t{flex:1;min-width:0}.row strong{display:block;font-weight:600;font-size:16px;line-height:1.2}.row span.m{color:var(--mu);font-size:13.5px}
.act{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--ln)}
.act.on{background:#fff;color:#000;border-color:#fff}.row.done{opacity:.55}
.ticks{display:flex;gap:3px;height:22px;margin:14px 0 8px}.ticks i{flex:1;background:var(--s2);border-radius:1px}.ticks i.on{background:#fff}
.fig{width:100%;height:100%;display:block}
.sheet{position:absolute;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sh{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 8px}
.x{width:44px;height:44px;border-radius:50%;background:var(--s1);display:grid;place-items:center;flex:none}
.sb{flex:1;overflow-y:auto;padding:8px 20px 20px;scrollbar-width:none}.sb::-webkit-scrollbar{display:none}
.foot{padding:12px 20px calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;border-top:1px solid var(--ln)}
.demo{position:relative;aspect-ratio:3/4;background:var(--s1);border:1px solid var(--ln);border-radius:28px;padding:22px;overflow:hidden;margin:6px 0 14px}
.demo video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.sp{position:absolute;right:12px;bottom:12px;z-index:6;background:rgba(0,0,0,.7);border:1px solid var(--ln);border-radius:99px;padding:0 14px;min-height:36px;font-family:var(--lb);font-size:13px;font-weight:600}
.rest-extra{position:absolute;right:-8px;top:-8px;font-family:var(--lb);font-size:13px;font-weight:700;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.45);border-radius:8px;padding:3px 8px;opacity:0;transition:opacity .3s}.rest-extra.show{opacity:1}.rest-card-glow{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.08);animation:card-pulse 2.5s ease-in-out infinite}@keyframes card-pulse{0%,100%{border-color:rgba(255,255,255,.06);box-shadow:0 0 0 0 rgba(255,255,255,0)}50%{border-color:rgba(255,255,255,.2);box-shadow:0 0 16px 2px rgba(255,255,255,.06)}}.skip-soft{border-color:#5a5a5a!important;color:#fff!important}.skip-soft:active{background:rgba(255,255,255,.1)!important}
.chips2{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 22px}.chips2 b{background:var(--s2);border-radius:12px;padding:6px 12px;font-weight:600;font-size:14px;font-family:var(--lb)}
ol.st{list-style:none;margin:12px 0 22px}ol.st li{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--ln);font-size:16px;line-height:1.35}ol.st li:last-child{border:0}
ol.st .n{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--mu);flex:none;display:grid;place-items:center;font-size:13px;font-weight:600}
.note{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;margin-bottom:12px;font-size:14.5px}.note b{font-weight:600}
.gr{display:flex;align-items:center;gap:14px;padding:12px 16px;width:100%;text-align:left;min-height:68px;border-bottom:1px solid var(--ln)}.gr:last-child{border:0}
.gr em{font-style:normal;font-size:22px;width:32px;text-align:center;filter:grayscale(1)}.gr em img{vertical-align:middle}.gr div{flex:1;min-width:0}.gr strong{display:block;font-weight:600}.gr span{color:var(--mu);font-size:13.5px}
.sw{width:52px;height:32px;border-radius:99px;background:var(--s2);position:relative;flex:none;border:1px solid var(--ln);transition:.2s}.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--mu);transition:.2s}
.on>.sw{background:#fff}.on>.sw:after{left:23px;background:#000}
.rm{color:var(--mu);font-size:13px;padding:8px 10px;min-height:44px}
nav{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:4px;background:rgba(30,30,30,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:99px;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.6)}
nav button{display:flex;align-items:center;gap:8px;padding:0 16px;height:48px;min-width:52px;justify-content:center;border-radius:99px;color:var(--mu);font-size:13.5px;font-weight:600}nav button.cur{background:#d9d9d9;color:#000}nav button span{display:none}nav button.cur span{display:inline}
.badge{display:inline-block;border:1.5px dashed #6b6b6b;border-radius:20px;padding:8px 20px;margin:10px 0 6px;background:#0a0a0a}.badge h1{font-size:36px}
.cm{display:inline-flex;gap:6px;align-items:center;background:var(--s2);border-radius:99px;padding:8px 14px;font-size:14px;color:var(--mu);font-family:var(--lb)}
.pv{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:16px 0}.pv .th{width:60px;height:60px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.stat{background:var(--s1);border:1px solid var(--ln);border-radius:24px;padding:18px 6px;text-align:center}.stat b{display:block;font-size:30px;font-weight:700;letter-spacing:-.03em;margin:8px 0 2px}.stat span{color:var(--mu);font-size:13.5px}.stat svg{color:var(--mu)}
.pills{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:14px}.pills i{height:24px;border-radius:99px;border:1.5px solid var(--ln)}.pills i.on{background:#d9d9d9;border-color:#d9d9d9}.pills i.rest{border-style:dashed;border-color:#4a4a4a}.pills i.now{border:2px solid #fff}
.wk{display:flex;align-items:flex-end;height:120px;margin-top:12px;gap:8px}.wk div{flex:1;text-align:center;font-family:var(--lb);font-size:11.5px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}.wk i{display:block;width:100%;border-radius:8px;background:#3a3a3a}.wk .t i{background:#e5e5e5}.wk b{font-weight:600;color:#fff}
.ch{display:flex;justify-content:space-between;align-items:baseline}.ch small{color:var(--mu);font-size:13.5px;font-family:var(--lb)}
.mo{display:flex;gap:16px;align-items:center}.mo .dm{width:120px;height:120px;flex:none;background:var(--s2);border-radius:20px;padding:8px}.mo .cta{height:44px;font-size:15px;width:auto;padding:0 20px}
.mask{position:absolute;inset:0;background:rgba(0,0,0,.7);z-index:20;display:flex;align-items:flex-end;animation:fade .2s}@keyframes fade{from{opacity:0}}
.modal{background:var(--s1);border:1px solid var(--ln);border-radius:28px 28px 0 0;padding:24px 20px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-height:88%;display:flex;flex-direction:column;gap:12px}
.modal .lst{overflow-y:auto;flex:1;min-height:80px}
.pk{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:10px 14px;border:1px solid var(--ln);border-radius:18px;margin-bottom:8px;min-height:56px}.pk.on{border-color:#fff;background:var(--s2)}.pk div{flex:1}.pk strong{display:block;font-weight:600}.pk span{color:var(--mu);font-size:13.5px}
.fld{background:var(--bg);border:1px solid var(--ln);border-radius:14px;height:50px;padding:0 14px;width:100%}
.ck{display:flex;gap:12px;align-items:center;padding:10px 4px;min-height:48px;width:100%;text-align:left}.ck i{width:24px;height:24px;border:2px solid var(--mu);border-radius:7px;flex:none;display:grid;place-items:center;color:transparent}.ck.on i{background:#fff;border-color:#fff;color:#000}
.toast{position:absolute;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 40px);bottom:96px;background:#fff;color:#000;border-radius:99px;padding:10px 18px;font-size:14px;font-weight:600;text-align:center;z-index:30;animation:up .25s;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.segs{display:flex;gap:5px;flex:1}.segs i{flex:1;height:5px;border-radius:9px;background:var(--s2)}
.big{font-weight:800;font-size:54px;letter-spacing:-.04em;line-height:1}.dots{display:flex;gap:10px;justify-content:center;margin:12px 0}.dots i{width:14px;height:14px;border-radius:50%;background:var(--s2)}.dots i.d{background:#fff}.dots i.c{border:2px solid #fff}
details{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;margin-top:10px;text-align:left}summary{font-weight:600;min-height:24px}
.demo{padding:30px 18px 30px!important}
.hud{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:8px;font-family:var(--lb);font-size:12.5px;font-weight:600;z-index:1;pointer-events:none}
.hud span{background:rgba(30,30,30,.9);border:1px solid var(--ln);border-radius:99px;padding:5px 11px;transition:color .15s,border-color .15s}
.hud .ph.ok{background:#fff;color:#000;border-color:#fff}
.cue{position:absolute;left:12px;bottom:14px;max-width:58%;font-size:12.5px;font-weight:600;background:rgba(0,0,0,.8);border:1px solid var(--ln);border-radius:12px;padding:6px 10px;z-index:1;pointer-events:none}
.pg{position:absolute;left:0;bottom:0;height:3px;background:#fff;opacity:.55;z-index:1}
.demo.ok{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.14)}
.demo.vid .fig,.demo.vid .hud,.demo.vid .cue,.demo.vid .pg{visibility:hidden}.sp.vd{right:10px;bottom:10px}
.fc{list-style:none;margin:8px 0 14px}.fc li{display:flex;gap:10px;padding:8px 0;align-items:flex-start;font-size:15.5px}.fc svg{color:#fff;flex:none;margin-top:2px}
.note.bad{border-style:dashed;border-color:#4a4a4a}.note.bad b{color:#fff}
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--ln);border-radius:99px;padding:4px}.seg button{flex:1;min-height:40px;border-radius:99px;font-family:var(--lb);font-weight:600;font-size:13.5px;color:var(--mu)}.seg button.on{background:#fff;color:#000}
.xtag svg,.chips2 b svg{vertical-align:-1px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ===== Explore tab ===== */
.eq{display:flex;flex-wrap:wrap;gap:8px}
.eb{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:99px;border:1.5px solid var(--ln);font-family:var(--lb);font-size:14px;font-weight:600;color:var(--mu)}
.eb em{font-style:normal;font-size:16px;filter:grayscale(1)}
.eb.on{background:#fff;color:#000;border-color:#fff}.eb:disabled{cursor:default}
.xs{position:sticky;top:0;z-index:4;margin:22px -20px 6px;padding:10px 20px 0;background:#000}
.xs:after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:14px;background:linear-gradient(#000,transparent);pointer-events:none}
.xs .srch{margin:0 0 12px}.xs .chips{margin-bottom:0;padding-bottom:10px}
.chip b{font-weight:600;font-size:12.5px;opacity:.55;margin-left:6px}
.xr{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--lb);font-size:13.5px;color:var(--mu);margin:14px 0 12px;min-height:36px}.xr .chip{min-height:36px;font-size:13.5px}
.xg{display:grid;grid-template-columns:1fr 1fr;gap:20px 12px}
.xc{position:relative}
.xo{display:block;width:100%;text-align:left}
.xt{position:relative;aspect-ratio:1/.9;background:var(--s1);border:1px solid var(--ln);border-radius:22px;padding:18px 14px 14px}
.xtag{position:absolute;left:10px;top:12px;display:inline-flex;align-items:center;gap:5px;font-family:var(--lb);font-size:11.5px;font-weight:600;color:var(--mu);background:rgba(30,30,30,.92);border:1px solid var(--ln);border-radius:99px;padding:3px 9px}
.xn{margin-top:10px;font-weight:600;font-size:15.5px;line-height:1.2;letter-spacing:-.01em}
.xm{margin-top:3px;font-family:var(--lb);font-size:13px;color:var(--mu)}
.xa{position:absolute;top:4px;right:4px;width:44px;height:44px;display:grid;place-items:center;z-index:2}
.xa span{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--ln);background:rgba(0,0,0,.7)}
.xa.on span{background:#fff;color:#000;border-color:#fff}
.xc.lk .fig{opacity:.3}.xc.lk .xn{color:var(--mu)}
.em{text-align:center;padding:36px 0 8px;display:flex;flex-direction:column;align-items:center;gap:8px}.em strong{font-size:17px}.em .cta{margin-top:10px}
.xf{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:40px;text-align:center}.xf p{font-size:13px}

.xo:active .xt{border-color:#555}.eb:active,.chip:active{transform:scale(.97)}
.th{position:relative}.th.dn .fig{opacity:.4}.th .tk{position:absolute;right:3px;bottom:3px;width:20px;height:20px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
.rt-c{transition:stroke-dashoffset .5s linear}
#splash.quick .sp-act{visibility:hidden}
.eb b{font-weight:600;font-size:12.5px;opacity:.55}
.xh{display:block;margin:28px auto 0;padding:10px;font-family:var(--lb);font-size:13.5px;color:var(--mu);text-decoration:underline;text-underline-offset:3px;text-align:center}
.modal .eq{margin:4px 0 8px}
.eb.fx{background:transparent;color:#fff;border:1.5px dashed #555}.eb.fx b{opacity:.55}
.eb .al{font-style:normal;font-family:var(--lb);font-size:11.5px;font-weight:600;color:var(--mu);border-left:1px solid var(--ln);padding-left:8px;margin-left:2px}
.sh2{display:flex;align-items:baseline;gap:8px;font-size:18px;margin:24px 0 12px}.sh2 span{font-family:var(--lb);font-size:13.5px;font-weight:600;color:var(--mu)}
/* ---------- Progress ---------- */
.prg-h{margin:20px 0 18px}
.prg-hero{padding:22px 20px 0;overflow:hidden;background:linear-gradient(180deg,#151515 0,#0b0b0b 80%);border:1px solid var(--ln);border-radius:28px;box-shadow:inset 0 1px 0 var(--hi)}
.prg-30{margin:20px -20px 0;border-top:1px solid var(--ln)}
.prg-kh{padding:14px 20px 0;font-size:13.5px;font-weight:500;color:var(--mu)}
.prg-kpis{display:grid;grid-template-columns:repeat(3,1fr)}
.prg-kpis>div{padding:8px 8px 18px 20px}.prg-kpis>div+div{border-left:1px solid var(--ln)}

const need=e=>{if(!S.gear[e.eq]&&!(e.eq==="bw"&&e.m==="Mobility"))return e.eq;if(e.hh)for(const k of e.hh.split("-"))if(S.home[k]===0)return k;return null};
const gname=k=>{const b=BASE.find(g=>g[0]===k);if(b)return b[2];const h=HOME.find(g=>g[0]===k);return h?h[1]:k};
const needKeys=L=>{const s=new Set();L.forEach(x=>{const e=x.e;if(e.eq!=="bw")s.add(e.eq);if(e.hh)e.hh.split("-").forEach(h=>s.add(h))});return[...s]};

// ---------- weekly schedule: a rolling queue ----------
// Your training days take the next workout in a cycle. Whatever you don't do simply stays "up next",
// so a missed day never needs fixing: the same workout is waiting for you the next day.
const CYC={3:["full","full","full"],4:["upper","legs","upper","legs"],5:["push","pull","legs","upper","legs"],6:["push","pull","legs","push","pull","legs"]};
const TRAIN={3:[1,0,1,0,1,0,0],4:[1,1,0,1,1,0,0],5:[1,1,1,0,1,1,0],6:[1,1,1,1,1,1,0]};   // Mon..Sun
const SPLITD={3:"Full body on Mon, Wed and Fri. Every session trains your whole body.",4:"Upper body and legs, each twice a week: Mon, Tue, Thu and Fri.",5:"Push, pull, legs, then upper and legs: Mon, Tue, Wed, Fri and Sat.",6:"Push, pull and legs twice a week, Monday to Saturday."};
const cyc=()=>CYC[S.days],isTrain=d=>!!TRAIN[S.days][dow(d)];
// a workout you have no kit for is skipped in the queue instead of blocking it
// core moves alone don't make a Legs or Pull day: a workout needs at least two of its own exercises
const CORE=new Set(["core","cplank","cdead","crot","clow","cside","cdyn"]);
const nCan=k=>{if(k==="mine")return S.mine.filter(id=>E[id]&&av(E[id])).length;const w=WO[k];if(!w)return 0;const o=new Set();w.sl.forEach(sl=>{if(w.ty!=="c"&&CORE.has(sl))return;(SL[sl]||[]).forEach(id=>{if(E[id]&&av(E[id]))o.add(id)})});return o.size};
const canDo=k=>k==="mine"?nCan(k)>0:nCan(k)>=2;
const offFrom=p=>{const L=cyc().length;for(let j=0;j<L;j++)if(canDo(cyc()[(p+j)%L]))return j;return 0};
const nextKey=()=>cyc()[(S.n+offFrom(S.n))%cyc().length];
const SH={full:"Full",push:"Push",pull:"Pull",legs:"Legs",upper:"Upper",chest:"Chest",arms:"Arms",shoulders:"Delts",core:"Core",cardio:"Cardio",mine:"Mine",rest:"Rest"};

// ---------- workout recipes: each program is an ordered list of movement slots ----------
// A slot is a movement pattern. The planner fills it with the first exercises you can actually do with your equipment.
const SL={

hing:["rdl","kb-deadlift","bag-rdl","band-gm","pull-through","goodmorning"],

push2:["wide-pushup","bar-wide-pushup","db-squeeze-press","stagger-pushup","bar-pause-pushup","pause-pushup","db-fly","bar-decline-pushup","decline-pushup","incline-pushup"],

row2:["towel-row","band-row","aus-row","kb-row","db-bent-row","bag-row","row"],
rear:["rear-fly","band-apart","face-pull","prone-y","prone-t","snow-angel"],
bi:["curl","db-hammer","band-curl","towel-curl"],
back:["superman","back-widow","prone-y","dead-hang","prone-t"],
core:["plank","bar-plank","deadbug","bicycle","side-plank","russian-twist","bird-dog","leg-raise","plank-tap","bar-tap","bar-climber"],
cplank:["plank","bar-plank","plank-tap","bar-tap","hollow"],cdead:["deadbug","bird-dog"],crot:["russian-twist","bicycle","kb-twist","pallof"],clow:["leg-raise","rev-crunch","flutter","hang-knee","crunch"],cside:["side-plank","pallof","bicycle"],cdyn:["climber","bar-climber","v-up","plank-tap","bar-tap"],
cardio:["jumping-jack","high-knees","squat-jump","climber","bar-climber","skater","burpee","shadow-box","butt-kick","bear-crawl","tuck-jump","swing","inchworm"]};
const WO={
full:{n:"Full body",d:"Legs, push, pull and core in one session",ty:"f",sl:["sq","push","row","hing","ohp","uni","core","tri","rear","glute"]},
upper:{n:"Upper body",d:"Chest, back, shoulders and arms",ty:"u",sl:["push","row","ohp","vpull","tri","bi","rear","delt","core"]},
legs:{n:"Legs",d:"Quads, glutes, hamstrings and calves",ty:"l",sl:["sq","hing","uni","glute","calf","leg2","uni","core"]},
push:{n:"Push",d:"Chest, shoulders and triceps",ty:"p",sl:["push","ohp","push2","tri","delt","tri","core"]},
pull:{n:"Pull",d:"Back, rear shoulders and biceps",ty:"u",sl:["vpull","row","row2","rear","bi","back","bi","core"]},
core:{n:"Core",d:"Abs, obliques and lower back",ty:"c",sl:["cplank","cdead","crot","clow","cside","cdyn","cplank","crot"]},
cardio:{n:"Cardio",d:"Get your heart rate up, no weights",ty:"v",sl:["cardio","cardio","cardio","cardio","cardio","cardio","cardio","cardio","cardio","cardio"]},
chest:{n:"Chest",d:"Chest, front shoulders and triceps",ty:"p",sl:["push","push2","push2","push","tri","delt"]},
arms:{n:"Arms",d:"Biceps and triceps",ty:"p",sl:["bi","tri","bi","tri","bi","tri"]},
shoulders:{n:"Shoulders",d:"Shoulders and upper back",ty:"p",sl:["ohp","delt","rear","delt","ohp","rear"]},};
const PORDER=["full","upper","legs","push","pull","core","cardio","chest","arms","shoulders"];
const pname=k=>k==="mine"?"My workout":k==="rest"?"Rest day":WO[k]?WO[k].n:"Workout",pdesc=k=>k==="mine"?"Your own list of exercises":k==="rest"?"Recovery day":WO[k]?WO[k].d:"";
if(S.fz&&!(S.fz.k==="mine"||WO[S.fz.k]))S.fz=null;
// warm-up: one "raise" move to get warm, then joint mobility and activation chosen for the day's muscles (RAMP style)
const WARM={
p:{r:["jumping-jack:45s","shadow-box:45s"],m:["arm-circles:20","wrist-circle:10","scap-pushup:10","catcow:8","wall-slide:10","t-spine:6","band-apart:15","inchworm:5"]},
u:{r:["jumping-jack:45s","high-knees:30s"],m:["arm-circles:20","catcow:8","t-spine:6","wall-slide:10","band-apart:15","scap-pull:6","scap-pushup:10","wrist-circle:10"]},
l:{r:["high-knees:30s","butt-kick:30s","march:45s"],m:["leg-swing:10","squat:10","lat-lunge:6","wgs:4","bridge:12","hip90:6","goodmorning:10","catcow:8","inchworm:5","bird-dog:6"]},
f:{r:["jumping-jack:45s","high-knees:30s"],m:["arm-circles:20","squat:10","wgs:4","inchworm:5","bridge:10","leg-swing:10","scap-pushup:10","catcow:8","t-spine:6","wall-slide:10"]},
c:{r:["march:45s","jumping-jack:30s"],m:["catcow:8","bird-dog:6","bridge:10","t-spine:6","wgs:4","hip90:6","inchworm:5","scap-pushup:10"]},
v:{r:["march:45s","jumping-jack:30s"],m:["arm-circles:20","leg-swing:10","squat:10","wgs:4","inchworm:5","lat-lunge:6","hip90:6"]}};
// cool-down: static holds (10-30 s each, ACSM) chosen by which muscles the session worked. [id, hold, muscles, order]
const COOL=[
["xbody-stretch","30s",["shoulders","upperback"],1],["tri-stretch","30s",["triceps","shoulders","lats"],2],["chest-stretch","30s",["chest","biceps","shoulders"],3],["side-bend","20s",["lats","core"],4],
["quad-stretch","30s",["quads"],5],["calf-stretch","30s",["calves"],6],["down-dog","30s",["hams","calves","shoulders","lats"],7],["hip-flexor","30s",["hipflex","quads"],8],
["ham-stretch","30s",["hams","back"],9],["fig4","30s",["glutes","hips"],10],["spinal-twist","30s",["back","glutes","core"],11],["childs-pose","40s",["lats","back","shoulders"],12],["cobra","20s",["core","hipflex","chest"],13],["overhead-reach","30s",["lats","core","shoulders"],14]];
const SD=new Set(["leg-swing","lat-lunge","wgs","t-spine","hip-flexor","quad-stretch","chest-stretch","xbody-stretch","tri-stretch","spinal-twist","fig4","calf-stretch","side-bend"]);
const BLN={w:"Warm-up",m:"Workout",c:"Cool-down"};
const blname=b=>BLN[b];

// which muscles an exercise works (drives the cool-down)
function mtags(e){const n=e.name.toLowerCase(),g=e.m,o={},a=(k,w)=>o[k]=Math.max(o[k]||0,w);
if(g==="Chest"){a("chest",1);a("triceps",.5);a("shoulders",.5)}
else if(g==="Back"){a("lats",1);a("upperback",.8);a("biceps",.5)}
else if(g==="Shoulders"){a("shoulders",1);a("triceps",.4);a("upperback",.3)}
else if(g==="Arms"){if(/tricep|dip|kickback|pushdown|close|diamond/.test(n)){a("triceps",1);a("chest",.3);a("shoulders",.3)}else{a("biceps",1);a("lats",.2)}}
else if(g==="Legs"){if(/bridge|donkey/.test(n)){a("glutes",1);a("hams",.6);a("quads",.2)}else if(/deadlift|rdl|romanian|good morning|pull-through/.test(n)){a("hams",1);a("glutes",.9);a("back",.4)}else if(/calf/.test(n)){a("calves",1)}else{a("quads",1);a("glutes",.8);a("hams",.3);a("hipflex",.4)}}
else if(g==="Core"){a("core",1);a("hipflex",.3);a("back",.2)}
else if(g==="Cardio"){a("quads",.6);a("calves",.5);a("shoulders",.3);a("core",.3)}
return o}

// ---------- building a session ----------
const wk=x=>/s$/.test(x.r)?parseInt(x.r):(parseInt(x.r)||10)*3;
const sec=x=>x.s*wk(x)+(x.s-1)*x.rs+(x.b==="m"?20:6);
function mk(id,b,o){o=o||{};const e=E[id],sd=SD.has(id),v=o.val||e.r;
const x={id,b,s:o.s!=null?o.s:sd?2:b==="m"?e.s:1,r:v,rs:sd?3:b==="m"?e.rs:6,sl:o.sl||"",sd:sd?1:0,from:o.from||""};return hydrate(x)}
function pick(key,used,v,i){const c=(SL[key]||[]).filter(id=>E[id]&&av(E[id])&&!used[id]);if(!c.length)return null;return c[(v+i)%Math.min(3,c.length)]}
// each time you finish a workout the next one of that kind swaps in different exercises
const variantFor=(d,k)=>S.vc[k]||0;
function build(k,d,len){const P=PH[len]||PH[30],v=variantFor(d,k);let warm=[],main=[],cool=[];
{const prog=k==="mine"?{ty:"f",sl:[]}:WO[k],budget=(len-P.w-P.c)*60,used={};let t=0;
if(k==="mine"){S.mine.forEach(id=>{const e=E[id],r=av(e)?e:(E[e.alt]&&av(E[e.alt])?E[e.alt]:null);if(!r||used[r.id])return;used[r.id]=1;main.push(mk(r.id,"m",{from:r===e?"":e.id}))})}
else{const n=prog.sl.length,tol=25;
for(let i=0;i<n;i++){const id=pick(prog.sl[i],used,v,i);if(!id)continue;const x=mk(id,"m",{sl:prog.sl[i]});if(main.length>=3&&t+sec(x)>budget+tol)break;used[id]=1;main.push(x);t+=sec(x)}
// a long session on a short recipe: go round the recipe again with the next-best exercise for each slot
for(let r=1;r<=2&&t<budget-80&&len>=30;r++)for(let i=0;i<n;i++){const key=prog.sl[i];if(CORE.has(key)&&prog.ty!=="c")continue;const id=pick(key,used,v+r,i);if(!id)continue;const x=mk(id,"m",{sl:key});if(t+sec(x)>budget+tol)continue;used[id]=1;main.push(x);t+=sec(x)}
main.sort((a,b)=>(CORE.has(a.sl)&&prog.ty!=="c"?1:0)-(CORE.has(b.sl)&&prog.ty!=="c"?1:0));
if(len>=45){let left=budget-t;for(let pass=0;pass<2;pass++)for(const x of main){if(x.s>=4)continue;const add=wk(x)+x.rs;if(left>=add+60){x.s++;left-=add}}}}
// warm-up
const W=WARM[prog.ty],inMain=new Set(main.map(x=>x.id)),ok=s=>{const id=s.split(":")[0];return E[id]&&avw(E[id])&&!inMain.has(id)},rz=W.r.filter(ok);let tw=0;
if(rz.length){const[id,val]=rz[v%rz.length].split(":"),x=mk(id,"w",{val});warm.push(x);tw+=sec(x)}
for(const s of W.m.filter(ok)){if(warm.length>=2&&tw>=P.w*60-20)break;const[id,val]=s.split(":"),x=mk(id,"w",{val});warm.push(x);tw+=sec(x)}
// cool-down
const wt={};main.forEach(x=>{const tg=mtags(E[x.id]);for(const q in tg)wt[q]=(wt[q]||0)+tg[q]*x.s});
const pool=COOL.filter(c=>avw(E[c[0]])).map(c=>({c,sc:0})),ch=[];let tc=0;
while(pool.length&&(ch.length<2||tc<P.c*60-20)){pool.forEach(p=>p.sc=p.c[2].reduce((a,q)=>a+(wt[q]||0),0)-p.c[3]*.001);pool.sort((a,b)=>b.sc-a.sc);const p=pool.shift();if(p.sc<=0&&ch.length>=2)break;ch.push(p.c);p.c[2].forEach(q=>wt[q]=(wt[q]||0)*.35);tc+=sec(mk(p.c[0],"c",{val:p.c[1]}))}
ch.sort((a,b)=>a[3]-b[3]);cool=ch.map(c=>mk(c[0],"c",{val:c[1]}))}
return{k,L:[...warm,...main,...cool]}}
const mins=L=>{const g=b=>L.filter(x=>x.b===b).reduce((a,x)=>a+sec(x),0),w=Math.round(g("w")/60),c=Math.round(g("c")/60),m=Math.max(1,Math.round(g("m")/60));return{w,m,c,tot:w+m+c}};
const key=x=>x.b+":"+x.id;

// ---------- today's plan is frozen once built so it never changes under you ----------
function plan(){const now=new Date(),t=iso(now),k=todayKey();if(k==="rest")return null;
if(!S.fz||S.fz.d!==t||S.fz.k!==k||S.fz.len!==S.len){S.fz={d:t,k,len:S.len,L:build(k,now,S.len).L,done:{}};save()}
return S.fz}
const invalidate=()=>{if(S.fz&&!Object.keys(S.fz.done).length)S.fz=null};

// ---------- history helpers ----------
const hday=n=>S.h[iso(dy(n))]||{s:0,r:0};
const isFin=h=>!!h&&(!!h.fin||(h.fin==null&&h.s>0));
const fmt=n=>n>=1e4?Math.round(n/1e3)+"k":n>=1e3?(n/1e3).toFixed(1)+"k":""+n;
const wkCount=off=>{const m=addD(mon0(new Date()),-7*off);let n=0;for(let i=0;i<7;i++){if(isFin(S.h[iso(addD(m,i))]))n++}return n};
const doneOn=d=>isFin(S.h[iso(d)]),anyDone=()=>Object.values(S.h).some(isFin);
// the last training day you missed (and haven't trained since), if any
function lateDay(d){const t0=parseIso(S.t0);for(let j=1;j<=7;j++){const p=addD(d,-j);if(p<t0)return null;if(doneOn(p))return null;if(isTrain(p))return p}return null}
// what today holds: the workout you picked, what you finished, the next one in the queue, or rest
function todayKey(){const t=new Date(),i=iso(t),h=S.h[i];
if(S.ov[i])return S.ov[i];
if(isFin(h)&&h.w&&S.more!==i)return h.w;
return isTrain(t)||lateDay(t)||!anyDone()?nextKey():"rest"}
// the remaining days of this week, filled from the queue
function weekAhead(){const n=new Date(),o={};let p=S.n;const tk=todayKey();if(!doneOn(n)&&tk!=="rest"&&tk===nextKey())p+=offFrom(p)+1;
for(let j=1;j<=6-dow(n);j++){const d=addD(n,j);if(isTrain(d)){const j2=offFrom(p);o[iso(d)]=cyc()[(p+j2)%cyc().length];p+=j2+1}else o[iso(d)]="rest"}return o}
function nextTrainDay(){const n=new Date();for(let j=1;j<=7;j++){const d=addD(n,j);if(isTrain(d))return{d,label:j===1?"Tomorrow":DN[dow(d)]}}return null}
// give today a different workout. The one you skip stays up next, so it is waiting for you tomorrow.
function choose(d,k){const i=iso(d);if(S.fz&&S.fz.d===i&&S.fz.k===k&&!doneOn(d))return;if(doneOn(d))S.more=i;S.ov={[i]:k};S.fz=null;save()}

/* ================= Fitforg v2 · screens ================= */
const rp=r=>/s$/.test(r)?r.replace("s"," sec"):r+" reps";
const spec=x=>{const t=/s$/.test(x.r),n=parseInt(x.r);let a;if(t)a=x.sd?n+" sec each side":x.s>1?x.s+" × "+n+" sec":n+" sec";else a=x.sd?n+" each side":x.s>1?x.s+" × "+n:n+" reps";return a+(x.e.eq!=="bw"?" · "+gname(x.e.eq):"")};
function toast(m){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;$("#app").append(t);setTimeout(()=>t.remove(),2800)}
function nav(){$("#nav").innerHTML=[["today","Today"],["stats","Progress"],["library","Explore"]].map(([k,l])=>`<button data-a="tab" data-v="${k}" class="${S.tab===k?"cur":""}" aria-label="${l}" aria-current="${S.tab===k}">${ic(k,22)}<span>${l}</span></button>`).join("")}
const MARK='<svg class="mk" viewBox="0 0 471 488" aria-hidden="true"><use href="#ff-mark"/></svg>';
const topBar=()=>{const d=wkCount(0),g=S.days;return`<div class="top"><span class="brand">${MARK}<span><b>FIT</b>FORG</span></span><span class="tr"><button class="wc" data-a="tab" data-v="stats" aria-label="${d} of ${g} workouts done this week"><b>${d}</b><span>/${g} this week</span></button><button class="ibtn" data-a="settings" aria-label="Settings">${ic("cog",20)}</button></span></div>`};

// ---------- demo slot: plays /videos/exercises/<id>.mp4 when it exists, otherwise shows the form guide with a placeholder tag ----------
const demo=(e,st)=>`<div class="demo" data-id="${e.id}"${st||""}>${fig(e,1)}${hud}<span class="vph">${ic("play",10,0)}Demo video coming soon</span></div>`;
const VC={};   // exercise id -> 1 (video found) or 0 (none), so a missing video is only looked for once per visit
function vid(root){root.querySelectorAll(".demo[data-id]:not([data-v])").forEach(d=>{d.dataset.v=1;if(VC[d.dataset.id]===0)return;const v=document.createElement("video");v.onerror=()=>{VC[d.dataset.id]=0};v.muted=true;v.loop=true;v.autoplay=true;v.setAttribute("playsinline","");v.preload="auto";
v.onloadeddata=()=>{VC[d.dataset.id]=1;if(!d.isConnected)return;d.classList.add("vid");d.prepend(v);v.play().catch(()=>{});const b=document.createElement("button");b.className="sp vd";b.textContent="1x";b.setAttribute("aria-label","Playback speed");b.onclick=ev=>{ev.stopPropagation();const r=[1,.5,1.5],i=(r.indexOf(v.playbackRate)+1)%3;v.playbackRate=r[i];b.textContent=r[i]+"x"};d.append(b);v.onclick=()=>v.paused?v.play():v.pause()};
v.src="/videos/exercises/"+d.dataset.id+".mp4"})}

// ---------- Today ----------
const row=(x,i,F)=>{const dn=F.done[key(x)];return`<div class="xr2${dn?" dn":""}"><button class="xr2-m" data-a="openx" data-v="${i}"><span class="th">${fig(x.e)}${dn?`<i class="tk">${ic(dn===2?"skip":"chk",11,3.5)}</i>`:""}</span><span class="xr2-t"><strong>${x.e.name}</strong><span class="m">${spec(x)}</span></span></button><button class="xr2-s" data-a="swap" data-v="${i}" aria-label="Swap ${x.e.name}">${ic("swap",18)}</button></div>`};
function blocks(F){const L=F.L,k=F.k;return["w","m","c"].map(b=>{const g=L.map((x,i)=>[x,i]).filter(([x])=>x.b===b);if(!g.length)return"";const m=Math.max(1,Math.round(g.reduce((a,[x])=>a+sec(x),0)/60));
return`<details class="blk ${b}"${b==="m"?" open":""}><summary><i class="dot"></i><b>${blname(b,k)}</b><span>${g.length} ${g.length===1?"move":"moves"} · ${m} min</span>${ic("chev",16,2.4)}</summary>${g.map(([x,i])=>row(x,i,F)).join("")}</details>`}).join("")}
function weekStrip(){const n=new Date(),m0=mon0(n),A=weekAhead(),t0=parseIso(S.t0);return`<section class="prg-card"><div class="prg-ch"><h2>This week</h2><small>${wkCount(0)} of ${S.days} done</small></div><div class="wkrow">${[...Array(7)].map((_,i)=>{const d=addD(m0,i),c=mid(d)-mid(n),h=S.h[iso(d)];let st,lab;
if(isFin(h)){st="done";lab=SH[h.w]||"Done"}
else if(c<0){st=d<t0?"pre":h&&h.s>0?"part":"past";lab=h&&h.s>0?SH[h.w]||"":"–"}
else if(c===0){const k=todayKey();st=k==="rest"?"rest":"plan";lab=k==="rest"?"Rest":SH[k]||""}

/* ================= Fitforg v2 · workout session and events ================= */
let ss=null,tm=null,th=null;
const topSheet=()=>[...document.querySelectorAll(".sheet")].pop();
function stop(){clearInterval(tm);clearInterval(th);ss=null;document.querySelectorAll(".sheet.run").forEach(s=>s.remove());render()}
function sv(){document.querySelector(".sheet.run")?.remove();const L=ss.L,x=L[ss.i],F=S.fz,e=x.e;let b,f="";
const hd=`<div class="segs">${L.map((y,j)=>`<i class="${y.b} ${F.done[key(y)]?"d":j===ss.i?"n":""}"></i>`).join("")}</div><span style="width:44px"></span>`;
if(ss.fin){const h=S.h[iso(new Date())]||{};b=`<div style="text-align:center;padding:36px 0 8px"><div class="okc big">${ic("chk",34,3)}</div><div class="big" style="font-size:40px">Workout complete</div><p class="mu" style="margin-top:10px;font-size:17px">${pname(F.k)}</p></div><div class="stats" style="margin-top:26px"><div class="stat"><b>${Math.max(1,Math.round((Date.now()-ss.t0)/60000))}</b><span>min</span></div><div class="stat"><b>${ss.sets}</b><span>sets</span></div><div class="stat"><b>${ss.reps}</b><span>reps</span></div></div><p style="text-align:center;margin-top:18px"><span class="pill">${wkCount(0)} of ${S.days} this week</span></p>`,f=`<button class="cta g" data-a="toprog">See progress</button><button class="cta" data-a="stop">Back to Today</button>`}
else if(ss.rest){const C2=2*Math.PI*80,lab=x.sd?(ss.set===1?"Left side":"Right side"):"Set "+ss.set+" of "+x.s;b=`<div style="text-align:center;padding-top:20px"><p class="lbl">${ss.max<=10?"Get ready":"Rest"}</p><div style="position:relative;width:180px;height:180px;margin:18px auto"><div class="rest-extra" id="restExtra"></div><svg width="180" height="180" style="transform:rotate(-90deg)"><circle cx="90" cy="90" r="80" fill="none" stroke="#1e1e1e" stroke-width="8"/><circle class="rt-c" cx="90" cy="90" r="80" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C2}" stroke-dashoffset="${C2*(1-ss.rest/ss.max)}"/></svg><div class="big rt-n" style="position:absolute;inset:0;display:grid;place-items:center;font-family:var(--lb);font-size:48px">${ss.rest}</div></div><div style="display:flex;gap:10px;justify-content:center">${ss.max<=10?"":`<button class="cta g s" data-a="p15">+15s</button>`}<button class="cta g s skip-soft" data-a="skip">${ss.max<=10?"Start now":"Skip rest"}</button></div></div><div class="rest-card-glow" style="margin:20px 0 0;padding:16px;background:var(--s1);border:1px solid var(--ln);border-radius:20px"><p class="lbl" style="margin:0 0 10px">Up next · ${blname(x.b,F.k)}</p><div style="display:flex;align-items:center;gap:14px"><div style="width:100px;height:100px;flex:none;background:var(--s2);border-radius:14px;padding:6px;box-shadow:0 0 12px rgba(255,255,255,.08)">${fig(e)}</div><div><strong style="font-size:17px;display:block;margin-bottom:4px">${e.name}</strong><span class="m" style="font-size:14px">${lab} · ${rp(x.r)}${x.sd?" each":""}</span></div></div></div>`}
else{const timed=/s$/.test(x.r),n=parseInt(x.r),first=ss.i===L.findIndex(y=>y.b==="m"),lab=x.sd?(ss.set===1?"Left side":"Right side"):"Set "+ss.set+" of "+x.s,pos=L.filter(y=>y.b===x.b),pi=pos.indexOf(x)+1,left=ss.hold?Math.max(0,Math.ceil((ss.hold.end-Date.now())/1000)):n;
b=`${demo(e,' style="margin-top:0;aspect-ratio:auto;height:clamp(240px,38vh,340px);padding-bottom:62px!important"')}<div style="text-align:center"><p class="phl ${x.b}"><i></i>${blname(x.b,F.k)} · ${pi} of ${pos.length}</p><h1 style="font-size:30px">${e.name}</h1><div class="big" style="margin:14px 0 4px"><span class="hv">${left}</span><span class="mu" style="font-size:20px;letter-spacing:0"> ${timed?"sec":"reps"}${x.sd&&!timed?" each":""}</span></div><div class="dots" aria-label="${lab}">${[...Array(x.s)].map((_,j)=>`<i class="${j<ss.set-1?"d":j===ss.set-1?"c":""}"></i>`).join("")}</div><p class="mu">${lab}${x.sd&&timed?" · "+n+" sec each side":""}</p>${first&&ss.set===1&&x.b==="m"&&!ss.hold?'<p class="hintc">Take this first set a little easier to groove the movement.</p>':""}</div><div class="ssw"><button class="ghost" data-a="swapx" data-v="${ss.i}">${ic("swap",15)} Swap exercise</button><button class="ghost" data-a="skipx">${ic("skip",15)} Skip</button></div><details${ss.set===1?" open":""}><summary>How to do it</summary><ol class="st">${e.st.map((t,i)=>`<li><span class="n">${i+1}</span><span>${t}</span></li>`).join("")}</ol>${fc(e)}</details>`;
f=timed?(ss.hold?`<button class="cta g" data-a="holdx">Cancel</button><button class="cta" data-a="cs">${ic("chk",22,3)} Done</button>`:`<button class="cta g" data-a="cs">Mark done</button><button class="cta" data-a="hold">${ic("clock",20)} Start ${n}s timer</button>`):`<button class="cta" data-a="cs">${ic("chk",22,3)} Complete set</button>`}
const sh=sheet(hd,b,f);sh.classList.add("run");sh.querySelector(".x").dataset.a="quit"}
function rest(sec){if(!sec){sv();return}ss.rest=ss.max=sec;ss.end=Date.now()+sec*1000;sv();clearInterval(tm);tm=setInterval(()=>{if(!ss)return clearInterval(tm);ss.rest=Math.max(0,Math.ceil((ss.end-Date.now())/1000));const el=document.querySelector(".rt-n");if(el)el.textContent=ss.rest;const circ=document.querySelector(".rt-c");if(circ){const C=2*Math.PI*80;circ.setAttribute("stroke-dashoffset",C*(1-ss.rest/ss.max))}if(ss.rest<=0){clearInterval(tm);ss.rest=0;try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}sv()}},500)}
function startHold(){const x=ss.L[ss.i];ss.hold={end:Date.now()+parseInt(x.r)*1000};clearInterval(th);th=setInterval(()=>{if(!ss||!ss.hold)return clearInterval(th);const r=Math.max(0,Math.ceil((ss.hold.end-Date.now())/1000)),el=document.querySelector(".hv");if(el)el.textContent=r;if(r<=0){clearInterval(th);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}completeSet()}},250);sv()}
function finishSession(){ss.fin=1;clearInterval(th);const t=iso(new Date()),h=S.h[t]=S.h[t]||{s:0,r:0,fin:0};const fk=S.fz.k;h.fin=1;h.w=fk;if(fk===nextKey())S.n+=offFrom(S.n)+1;S.vc[fk]=(S.vc[fk]||0)+1;S.more=null;h.m=(h.m||0)+Math.max(1,Math.round((Date.now()-ss.t0)/60000));save();sv()}
function nextItem(){const F=S.fz,n=ss.L.findIndex(y=>!F.done[key(y)]);return n}
function completeSet(){clearInterval(th);ss.hold=null;const x=ss.L[ss.i],F=S.fz,t=iso(new Date()),h=S.h[t]=S.h[t]||{s:0,r:0,fin:0};
if(x.b==="m"){const n_=/s$/.test(x.r)?0:(parseInt(x.r)||0)*(x.sd?2:1);h.s++;h.r+=n_;ss.sets++;ss.reps+=n_}
if(ss.set<x.s){ss.set++;save();rest(x.rs)}else{F.done[key(x)]=1;const n=nextItem();if(n<0){finishSession()}else{ss.i=n;ss.set=1;save();rest(x.rs)}}}
function skipEx(){clearInterval(th);ss.hold=null;const x=ss.L[ss.i],F=S.fz;F.done[key(x)]=2;const n=nextItem();if(n<0)finishSession();else{ss.i=n;ss.set=1;save();sv()}}
const closeMask=()=>document.querySelector(".mask")?.remove();
const dayWord=d=>iso(d)===iso(new Date())?"today":DN[dow(d)];

document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;$("#exl").innerHTML=exrows();still()}});
$("#app").onclick=ev=>{const b=ev.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
if(a==="tab"){S.tab=v;save();document.querySelectorAll(".sheet:not(.run)").forEach(s=>s.remove());render();$("#main").scrollTop=0}
else if(a==="mu"){S.mu=v;render()}else if(a==="clr"){S.q="";S.mu="All";render()}
else if(a==="own"){const id=document.querySelector(".sheet")?.dataset.id;if(BASE.some(g=>g[0]===v))S.gear[v]=1;else S.home[v]=1;invalidate();save();document.querySelector(".sheet")?.remove();render();if(id)open_(id);toast(gname(v)+" turned on")}
else if(a==="toprog"){stop();S.tab="stats";render();$("#main").scrollTop=0}
else if(a==="goexp"){closeMask();S.tab="library";render();$("#main").scrollTop=0}
else if(a==="settings"){setupSheet(false)}
else if(a==="tg"){if(S.gear[v]&&BASE.filter(g=>S.gear[g[0]]).length<2){toast("Keep at least one on");return}S.gear[v]=S.gear[v]?0:1;invalidate();save();refSet();render()}
else if(a==="th"){S.home[v]=S.home[v]===0?1:0;invalidate();save();refSet();render()}
else if(a==="sdays"){S.days=+v;S.n=0;S.ov={};S.fz&&!Object.keys(S.fz.done).length&&(S.fz=null);save();refSet();render()}
else if(a==="slen"){S.len=+v;invalidate();save();refSet();render()}
else if(a==="eqdone"){if(!BASE.some(g=>S.gear[g[0]])){toast("Pick at least one option");return}S.eqSet=1;save();document.querySelector(".sheet.set")?.remove();render()}
else if(a==="quit"){if(ss&&ss.fin)stop();else ask(`<h2>End workout?</h2><p class="mu">Finished sets are saved. You can resume from Today.</p><button class="cta" data-a="close2">Keep going</button><button class="cta g" data-a="stop2">End workout</button>`)}
else if(a==="stop2"){closeMask();stop()}
else if(a==="open"||a==="open2"){if(a==="open2")topSheet()?.remove();open_(v)}
else if(a==="openx"){open_(S.fz.L[+v].id,+v)}
else if(a==="close"){const s=topSheet();s&&!s.classList.contains("run")&&s.remove();render()}
else if(a==="mine"){const i=S.mine.indexOf(v);i<0?S.mine.push(v):S.mine.splice(i,1);save();render();toast(i<0?"Added to My workout":"Removed from My workout")}
else if(a==="mine2"){const i=S.mine.indexOf(v);i<0?S.mine.push(v):S.mine.splice(i,1);save();b.textContent=i<0?"Remove from my workout":"Add to my workout";toast(i<0?"Added to My workout":"Removed")}
else if(a==="pick"){closeMask();pickSheet()}
else if(a==="plen"){S.len=+v;invalidate();save();repick()}
else if(a==="choose"){choose(new Date(),v);closeMask();render();$("#main").scrollTop=0;toast(pname(v)+" is today’s workout"+(v!==nextKey()?". "+pname(nextKey())+" stays up next":""))}
else if(a==="anyway"){choose(new Date(),nextKey());render();$("#main").scrollTop=0}
else if(a==="swap"){swapAsk(+v)}
else if(a==="swapx"){const s=b.closest(".sheet");if(s&&!s.classList.contains("run"))s.remove();swapAsk(+v)}
else if(a==="dosw"){const[i,id,val]=v.split("|"),F=S.fz,old=F.L[+i],nx=mk(id,old.b,{sl:old.sl,val:val||undefined});F.L[+i]=nx;save();closeMask();if(ss){clearInterval(th);ss.hold=null;ss.set=1;sv()}else render();toast("Swapped to "+E[id].name)}
else if(a==="skipx"){skipEx()}
else if(a==="go"){const F=plan();if(!F)return;if(F.L.every(x=>F.done[key(x)]))F.done={};ss={L:F.L,i:F.L.findIndex(x=>!F.done[key(x)]),set:1,rest:0,fin:0,p15count:0,t0:Date.now(),sets:0,reps:0,hold:null};sv()}
else if(a==="cs"){completeSet()}
else if(a==="hold"){startHold()}
else if(a==="holdx"){clearInterval(th);ss.hold=null;sv()}
else if(a==="skip"){clearInterval(tm);ss.rest=0;sv()}
else if(a==="p15"){if(ss.p15count>=3){toast("Stop resting, start grinding. You got this.");return}ss.p15count++;ss.rest+=15;ss.max+=15;ss.end+=15000;const el=document.querySelector(".rt-n");if(el)el.textContent=ss.rest;const circ=document.querySelector(".rt-c");if(circ){const C=2*Math.PI*80;circ.setAttribute("stroke-dashoffset",C*(1-ss.rest/ss.max))}const eb=document.getElementById("restExtra");if(eb){eb.textContent="+"+(ss.p15count*15)+"s";eb.classList.add("show")}toast(["Good to go.","One last breather.","That’s all the rest you need."][ss.p15count-1]||"")}
else if(a==="stop")stop();
else if(a==="rs"){ask(`<h2>Reset progress?</h2><p class="mu">This clears your workout history and today’s session. Equipment and schedule stay. This can’t be undone.</p><button class="cta" data-a="rs2">Yes, reset</button><button class="cta g" data-a="close2">Cancel</button>`)}
else if(a==="rs2"){S.h={};S.fz=null;S.ov={};S.n=0;S.vc={};S.more=null;S.t0=iso(new Date());save();closeMask();render();toast("Progress reset")}
else if(a==="close2")closeMask()};
render();

</script>
<script>
// Fitforg welcome screen. The "Start training" button shows only on the very first launch.
// Every later launch shows just the opening screen for a moment, then goes straight to Today.
(function(){
const sp=document.getElementById("splash"),go=document.getElementById("sp-go"),lock=["main","nav"].map(i=>document.getElementById(i));
const rd=()=>{try{if(localStorage.getItem("ff_welcome")==="1")return 1}catch(e){}return /(?:^|; )ff_welcome=1/.test(document.cookie)?1:0};
const wr=()=>{try{localStorage.setItem("ff_welcome","1")}catch(e){}try{document.cookie="ff_welcome=1; max-age=315360000; path=/; SameSite=Lax"}catch(e){}};
let seen=rd();
try{if(!seen&&localStorage.getItem("ff3"))seen=1}catch(e){}   // data from the previous app version means they have used it before (ff4 is not checked: the app writes it while loading)
if(location.hash==="#welcome")seen=0;     // add #welcome to the address to preview the first-launch screen
lock.forEach(n=>n.inert=true);
let done=0;
function leave(){if(done)return;done=1;sp.classList.add("out");lock.forEach(n=>n.inert=false);setTimeout(function(){sp.remove();render();still();if(!S.eqSet)setTimeout(function(){setupSheet(true)},300)},450)}
if(seen){sp.classList.add("quick");sp.onclick=leave;setTimeout(leave,1200)}
else{wr();go.onclick=leave}
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(function(){})}</script>
