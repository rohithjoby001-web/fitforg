<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--s1:#0d0d0d;--s2:#1e1e1e;--ln:#2b2b2b;--fg:#fff;--mu:#8c8c8c;--hd:'Inter Tight',system-ui,sans-serif;--lb:'Space Grotesk',system-ui,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--hd);font-size:15px;line-height:1.4;display:flex;justify-content:center}
button,input{font:inherit;color:inherit;background:none;border:0}button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
#app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:#000}
@media (min-width:520px){body{background:#000;align-items:center}#app{height:min(880px,calc(100% - 32px));border-radius:36px;border:1px solid var(--ln)}}
main{flex:1;overflow-y:auto;padding:20px 20px 110px;scrollbar-width:none}main::-webkit-scrollbar{display:none}
h1{font-weight:800;font-size:38px;letter-spacing:-.045em;line-height:1}
h2{font-weight:700;font-size:19px;letter-spacing:-.02em}
.mu{color:var(--mu)}
.lbl,.date,.pill,.chip,nav button,.chips b,.n{font-family:var(--lb)}
.lbl,.date{text-transform:uppercase;letter-spacing:.12em;font-size:11.5px;color:var(--mu)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.pill{border:1px solid var(--ln);border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:24px;padding:20px}
.cta{width:100%;height:56px;border-radius:99px;background:#fff;color:#000;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:9px}
.cta:active{transform:scale(.98)}.cta.g{background:none;border:1.5px solid var(--ln);color:#fff}.cta.s{height:44px;font-size:15px;width:auto;padding:0 18px}
.srch{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:0 14px;height:50px;margin:16px 0 12px}
.srch input{flex:1;height:100%;outline:0}.srch input::placeholder{color:var(--mu)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 16px;padding:0 20px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--ln);border-radius:99px;padding:0 16px;min-height:40px;font-size:14px;font-weight:500;color:var(--mu)}
.chip.on{background:#fff;color:#000;border-color:#fff;font-weight:600}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px;margin-bottom:10px;background:var(--s1);border:1px solid var(--ln);border-radius:20px;min-height:76px}
.th{width:56px;height:56px;flex:none;background:var(--s2);border-radius:14px;padding:4px}
.row .t{flex:1;min-width:0}.row strong{display:block;font-weight:600;font-size:16px;line-height:1.2}.row span.m{color:var(--mu);font-size:13.5px}
.act{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--ln)}
.act.on{background:#fff;color:#000;border-color:#fff}.row.done{opacity:.55}
.ticks{display:flex;gap:3px;height:22px;margin:14px 0 8px}.ticks i{flex:1;background:var(--s2);border-radius:1px}.ticks i.on{background:#fff}
.fig{width:100%;height:100%;display:block;max-height:320px}
.sheet{position:absolute;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sh{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 8px}
.x{width:44px;height:44px;border-radius:50%;background:var(--s1);display:grid;place-items:center;flex:none}
.sb{flex:1;overflow-y:auto;padding:8px 20px 20px;scrollbar-width:none}.sb::-webkit-scrollbar{display:none}
.foot{padding:12px 20px calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;border-top:1px solid var(--ln)}
.demo{position:relative;aspect-ratio:1/1.15;background:var(--s1);border:1px solid var(--ln);border-radius:28px;padding:22px;overflow:hidden;margin:8px 0 28px}
.demo video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.sp{position:absolute;right:12px;bottom:12px;z-index:2;background:rgba(0,0,0,.7);border:1px solid var(--ln);border-radius:99px;padding:0 14px;min-height:36px;font-family:var(--lb);font-size:13px;font-weight:600}
.chips2{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 22px}.chips2 b{background:var(--s2);border-radius:12px;padding:6px 12px;font-weight:600;font-size:14px;font-family:var(--lb)}
ol.st{list-style:none;margin:12px 0 22px}ol.st li{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--ln);font-size:16px;line-height:1.35}ol.st li:last-child{border:0}
ol.st .n{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--mu);flex:none;display:grid;place-items:center;font-size:13px;font-weight:600}
.note{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;margin-bottom:12px;font-size:14.5px}.note b{font-weight:600}
.gr{display:flex;align-items:center;gap:14px;padding:12px 16px;width:100%;text-align:left;min-height:68px;border-bottom:1px solid var(--ln)}.gr:last-child{border:0}
.gr em{font-style:normal;font-size:22px;width:32px;text-align:center;filter:grayscale(1)}.gr div{flex:1;min-width:0}.gr strong{display:block;font-weight:600}.gr span{color:var(--mu);font-size:13.5px}
.sw{width:52px;height:32px;border-radius:99px;background:var(--s2);position:relative;flex:none;border:1px solid var(--ln);transition:.2s}.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--mu);transition:.2s}
.on>.sw{background:#fff}.on>.sw:after{left:23px;background:#000}
.rm{color:var(--mu);font-size:13px;padding:8px 10px;min-height:44px}
nav{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:4px;background:rgba(30,30,30,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:99px;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.6)}
nav button{display:flex;align-items:center;gap:8px;padding:0 16px;height:48px;min-width:52px;justify-content:center;border-radius:99px;color:var(--mu);font-size:13.5px;font-weight:600}nav button.cur{background:#d9d9d9;color:#000}nav button span{display:none}nav button.cur span{display:inline}
.badge{display:inline-block;border:1.5px dashed #6b6b6b;border-radius:20px;padding:8px 20px;margin:10px 0 6px;background:#0a0a0a}.badge h1{font-size:36px}
.cm{display:inline-flex;gap:6px;align-items:center;background:var(--s2);border-radius:99px;padding:8px 14px;font-size:14px;color:var(--mu);font-family:var(--lb)}
.pv{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:16px 0}.pv .th{width:60px;height:60px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.stat{background:var(--s1);border:1px solid var(--ln);border-radius:24px;padding:18px 6px;text-align:center}.stat b{display:block;font-size:30px;font-weight:700;letter-spacing:-.03em;margin:8px 0 2px}.stat span{color:var(--mu);font-size:13.5px}.stat svg{color:var(--mu)}
.pills{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:14px}.pills i{height:24px;border-radius:99px;border:1.5px solid var(--ln)}.pills i.on{background:#d9d9d9;border-color:#d9d9d9}.pills i.rest{border-style:dashed;border-color:#4a4a4a}.pills i.now{border:2px solid #fff}
.wk{display:flex;align-items:flex-end;height:120px;margin-top:12px;gap:8px}.wk div{flex:1;text-align:center;font-family:var(--lb);font-size:11.5px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}.wk i{display:block;width:100%;border-radius:8px;background:#3a3a3a}.wk .t i{background:#e5e5ea}.wk b{font-weight:600;color:#fff}
.ch{display:flex;justify-content:space-between;align-items:baseline}.ch small{color:var(--mu);font-size:13.5px;font-family:var(--lb)}
.mo{display:flex;gap:16px;align-items:center}.mo .dm{width:120px;height:120px;flex:none;background:var(--s2);border-radius:20px;padding:8px}.mo .cta{height:44px;font-size:15px;width:auto;padding:0 20px}
.mask{position:absolute;inset:0;background:rgba(0,0,0,.7);z-index:20;display:flex;align-items:flex-end;animation:fade .2s}@keyframes fade{from{opacity:0}}
.modal{background:var(--s1);border:1px solid var(--ln);border-radius:28px 28px 0 0;padding:24px 20px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-height:88%;display:flex;flex-direction:column;gap:12px}
.modal .lst{overflow-y:auto;flex:1;min-height:80px}
.pk{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px;border:1px solid var(--ln);border-radius:18px;margin-bottom:8px;min-height:64px}.pk.on{border-color:#fff;background:var(--s2)}.pk div{flex:1}.pk strong{display:block;font-weight:600}.pk span{color:var(--mu);font-size:13.5px}
.fld{background:var(--bg);border:1px solid var(--ln);border-radius:14px;height:50px;padding:0 14px;width:100%}
.ck{display:flex;gap:12px;align-items:center;padding:10px 4px;min-height:48px;width:100%;text-align:left}.ck i{width:24px;height:24px;border:2px solid var(--mu);border-radius:7px;flex:none;display:grid;place-items:center;color:transparent}.ck.on i{background:#fff;border-color:#fff;color:#000}
.toast{position:absolute;left:20px;right:20px;bottom:92px;background:#fff;color:#000;border-radius:16px;padding:14px 16px;font-weight:600;z-index:30;animation:up .25s}
.segs{display:flex;gap:5px;flex:1}.segs i{flex:1;height:5px;border-radius:9px;background:var(--s2)}.segs i.d{background:#fff}.segs i.c{background:var(--mu)}
.big{font-weight:800;font-size:54px;letter-spacing:-.04em;line-height:1}.dots{display:flex;gap:10px;justify-content:center;margin:12px 0}.dots i{width:14px;height:14px;border-radius:50%;background:var(--s2)}.dots i.d{background:#fff}.dots i.c{border:2px solid #fff}
details{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;margin-top:10px;text-align:left}summary{font-weight:600;min-height:24px}
.demo{padding:46px 18px 42px!important}
.hud{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:8px;font-family:var(--lb);font-size:12.5px;font-weight:600;z-index:1;pointer-events:none}
.hud span{background:rgba(30,30,30,.9);border:1px solid var(--ln);border-radius:99px;padding:5px 11px;transition:color .15s,border-color .15s}
.hud .ph.ok{color:#4ade80;border-color:#4ade80}
.cue{position:absolute;left:12px;bottom:14px;max-width:58%;font-size:12.5px;font-weight:600;background:rgba(0,0,0,.8);border:1px solid var(--ln);border-radius:12px;padding:6px 10px;z-index:1;pointer-events:none}
.pg{position:absolute;left:0;bottom:0;height:3px;background:#fff;opacity:.55;z-index:1}
.demo.ok{border-color:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.18)}
.demo.vid .fig,.demo.vid .hud,.demo.vid .cue,.demo.vid .pg{visibility:hidden}.sp.vd{right:84px}
.fc{list-style:none;margin:8px 0 14px}.fc li{display:flex;gap:10px;padding:8px 0;align-items:flex-start;font-size:15.5px}.fc svg{color:#4ade80;flex:none;margin-top:2px}
.note.bad{border-color:#5a2a2a}.note.bad b{color:#f87171}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ===== Fitforg welcome screen (independent section) ===== */
.mk{display:block;width:26px;height:auto;flex:none;fill:#fff}
#splash{container-type:size;position:absolute;inset:0;z-index:60;background:#000;overflow:hidden;transition:opacity .4s ease,transform .4s ease}
#splash.out{opacity:0;transform:scale(1.02);pointer-events:none}
#splash .sp-ghost{position:absolute;width:560px;right:-190px;top:-40px;fill:none;stroke:#2b2b2b;stroke-width:1.2;pointer-events:none;width:96.5cqh;height:100cqh;right:auto;left:calc(61.7cqw - 44.05cqh);top:auto;bottom:calc(100px + env(safe-area-inset-bottom,0px) - .72cqh)}
#splash .sp-sm{position:absolute;left:26px;top:calc(34px + env(safe-area-inset-top,0px));width:34px;height:auto;fill:#fff;left:8.67cqw;width:11.33cqw;top:calc(11.33cqw + env(safe-area-inset-top,0px))}
#splash .sp-txt{position:absolute;left:26px;right:26px;bottom:calc(130px + env(safe-area-inset-bottom,0px));text-align:left;opacity:0;animation:sp-up .8s .5s forwards}
#splash .sp-name{font-family:var(--lb);font-weight:400;font-size:36px;letter-spacing:.14em;line-height:1;margin:0 0 12px}
#splash .sp-name b{font-weight:700}
#splash .sp-tag{font-family:var(--hd);font-size:18px;line-height:1.3;color:#8c8c8c;letter-spacing:normal}
#splash .sp-act{position:absolute;left:26px;right:26px;bottom:calc(48px + env(safe-area-inset-bottom,0px))}
#splash .sp-act .cta{max-width:none;width:100%;height:52px;border:0;border-radius:99px;background:#fff;color:#000;font:700 16px var(--hd)}
@keyframes sp-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash .sp-txt{opacity:1;transform:none;animation:none}#splash{transition:opacity .01s}}
</style>
</head>
<body style="background:#000">
<div id="preloader" style="position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .3s"><div style="width:30px;height:30px;border:2px solid #333;border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite"></div></div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
<div id="app"><main id="main"></main><nav id="nav"></nav>

function render(){nav();$("#main").innerHTML={today:vToday,ex:vEx,gear:vGear}[S.tab]();still()}
function sheet(h,b,f){const s=document.createElement("div");s.className="sheet";s.innerHTML=`<div class="sh"><button class="x" data-a="close" aria-label="Close">${ic("x")}</button>${h}</div><div class="sb">${b}</div>${f?`<div class="foot">${f}</div>`:""}`;$("#app").append(s);still();return s}
function open_(id){const e=E[id],ok=av(e),mine=S.mine.includes(id);
const s=sheet(`<span class="lbl">${e.m}</span>`,`${demo(e)}
<h1 style="margin-top:6px">${e.name}</h1><div class="chips2"><b>${e.s} sets</b><b>${rp(e.r)}</b><b>${e.rs}s rest</b><b>${gname(e.eq)}</b></div>
${ok?"":`<div class="note"><b>Needs ${gname(e.eq)}.</b> ${e.alt?`Your workouts will use ${E[e.alt].name} instead.`:"Add the gear in the Gear tab to unlock it."}</div>`}
<h2>How to do it</h2><ol class="st">${e.st.map((t,i)=>`<li><span class="n">${i+1}</span><span>${t}</span></li>`).join("")}</ol>
<div class="note"><b>Form tip.</b> ${e.tp}</div>${fc(e)}${e.alt&&E[e.alt]?`<button class="row" data-a="open2" data-v="${e.alt}" style="margin-top:14px"><div class="th">${fig(E[e.alt].p,E[e.alt].eq)}</div><div class="t"><strong>${E[e.alt].name}</strong><span class="m">No-gear alternative</span></div></button>`:""}`,
`<button class="cta" data-a="mine2" data-v="${id}">${mine?"Remove from my workout":"Add to my workout"}</button>`);s.dataset.id=id}
function ask(html,onok){const m=document.createElement("div");m.className="mask";m.innerHTML=`<div class="modal" role="dialog">${html}</div>`;$("#app").append(m);m.onclick=e=>{if(e.target===m)m.remove()};return m}
function pick(){const m=ask(`<h2>Choose a workout</h2><div class="lst">${Object.entries(WO).map(([k,[n,d,l]])=>`<button class="pk ${S.wo===k?"on":""}" data-a="setwo" data-v="${k}"><div><strong>${n}</strong><span>${d} · ${l.length} moves</span></div>${S.wo===k?ic("chk",20,3):""}</button>`).join("")}<button class="pk ${S.wo==="mine"?"on":""}" data-a="setwo" data-v="mine"><div><strong>My workout</strong><span>Build your own · ${S.mine.length} moves</span></div>${S.wo==="mine"?ic("chk",20,3):""}</button></div>`)}
function addg(){ask(`<h2>Add equipment</h2><input class="fld" id="gn" placeholder="e.g. Yoga mat, Chair, Jump rope" aria-label="Equipment name"><p class="mu" style="font-size:14px">Which exercises can you do with it?</p><div class="lst">${Object.values(E).map(e=>`<button class="ck" data-a="ckx" data-v="${e.id}"><i>${ic("chk",14,3.5)}</i><span>${e.name} <span class="mu">· ${e.m}</span></span></button>`).join("")}</div><button class="cta" data-a="saveg">Save equipment</button>`)}
// workout session
let ss=null,tm=null;
function stop(){clearInterval(tm);ss=null;$(".sheet")?.remove();render()}
function sv(){document.querySelector(".sheet")?.remove();const L=ss.L,e=L[ss.i],nx=L.find((x,j)=>j!==ss.i&&!S.done[dk(x)]);let b,f="";
const hd=`<div class="segs">${L.map((x,j)=>`<i class="${S.done[dk(x)]?"d":j===ss.i?"c":""}"></i>`).join("")}</div><span style="width:44px"></span>`;
if(ss.fin)b=`<div style="text-align:center;padding:60px 0"><div class="big">Done.</div><p class="mu" style="margin-top:12px">${wname()} complete. Streak: ${streak()} days.</p></div>`,f=`<button class="cta" data-a="stop">Back to workout</button>`;
else if(ss.rest){const C=2*Math.PI*88;b=`<div style="text-align:center;padding-top:10px"><p class="lbl">Rest</p><div style="position:relative;width:200px;height:200px;margin:14px auto"><svg width="200" height="200" style="transform:rotate(-90deg)"><circle cx="100" cy="100" r="88" fill="none" stroke="#1e1e1e" stroke-width="10"/><circle cx="100" cy="100" r="88" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-ss.rest/ss.max)}"/></svg><div class="big" style="position:absolute;inset:0;display:grid;place-items:center;font-family:var(--lb)">${ss.rest}</div></div><div style="display:flex;gap:10px;justify-content:center"><button class="cta g s" data-a="p15">+15s</button><button class="cta g s" data-a="skip">Skip rest</button></div></div><p class="lbl" style="margin:26px 0 8px">Up next</p><div class="row"><div class="th">${fig(e.p,e.eq)}</div><div class="t"><strong>${e.name}</strong><span class="m">Set ${ss.set} of ${e.s}</span></div></div>`}
else b=`${demo(e,' style="margin-top:0;aspect-ratio:4/3"')}<div style="text-align:center"><h1 style="font-size:30px">${e.name}</h1><div class="big" style="margin:14px 0 4px">${e.r.replace("s","")}<span class="mu" style="font-size:20px;letter-spacing:0"> ${/s$/.test(e.r)?"sec":"reps"}</span></div><div class="dots" aria-label="Set ${ss.set} of ${e.s}">${[...Array(e.s)].map((_,j)=>`<i class="${j<ss.set-1?"d":j===ss.set-1?"c":""}"></i>`).join("")}</div><p class="mu">Set ${ss.set} of ${e.s}</p></div><details><summary>How to do it</summary><ol class="st">${e.st.map((t,i)=>`<li><span class="n">${i+1}</span><span>${t}</span></li>`).join("")}</ol>${fc(e)}</details>`,f=`<button class="cta" data-a="cs">${ic("chk",22,3)} Complete set</button>`;
const sh=sheet(hd,b,f);sh.querySelector(".x").dataset.a="stop"}
function rest(sec){if(!sec){sv();return}ss.rest=ss.max=sec;sv();clearInterval(tm);tm=setInterval(()=>{if(!ss)return clearInterval(tm);ss.rest--;const el=document.querySelector(".big[style*=\"position:absolute\"]");if(el)el.textContent=ss.rest;const circ=document.querySelector("circle:last-of-type");if(circ){const C=2*Math.PI*88;circ.setAttribute("stroke-dashoffset",C*(1-ss.rest/ss.max))}if(ss.rest<=0){clearInterval(tm);ss.rest=0;sv()}},1000)}
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;$("#exl").innerHTML=exrows();still()}});
$("#app").onclick=ev=>{const b=ev.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
if(a==="tab"){S.tab=v;render();$("#main").scrollTop=0}
else if(a==="mu"){S.mu=v;render()}else if(a==="mg"){S.mg^=1;render()}
else if(a==="open"||a==="open2"){if(a==="open2")document.querySelector(".sheet")?.remove();open_(v)}
else if(a==="close"){document.querySelector(".sheet")?.remove();render()}
else if(a==="mine"){const i=S.mine.indexOf(v);i<0?S.mine.push(v):S.mine.splice(i,1);save();render();toast(i<0?"Added to My workout":"Removed from My workout")}
else if(a==="mine2"){const i=S.mine.indexOf(v);i<0?S.mine.push(v):S.mine.splice(i,1);save();b.textContent=i<0?"Remove from my workout":"Add to my workout";toast(i<0?"Added to My workout":"Removed")}
else if(a==="vd"){const d=b.parentNode,q=d.querySelector("video");if(q){q.remove();d.classList.remove("vid");b.textContent="Video"}else{d.insertAdjacentHTML("afterbegin",`<video src="/videos/exercises/${v}.mp4" autoplay muted loop playsinline onerror="this.parentNode.classList.remove('vid');this.remove()"></video>`);d.classList.add("vid");b.textContent="Guide"}}
else if(a==="sp"){const f=b.parentNode.querySelector(".fig"),h=f.dataset.sp==="6";f.dataset.sp=h?3:6;b.textContent=h?"1×":"0.5×"}
else if(a==="pick")pick();else if(a==="setwo"){S.wo=v;save();document.querySelector(".mask").remove();render()}
else if(a==="go"){const L=wl().map(x=>x.e);if(L.every(x=>S.done[dk(x)]))L.forEach(x=>delete S.done[dk(x)]);ss={L,i:L.findIndex(x=>!S.done[dk(x)]),set:1,rest:0,fin:0};sv()}
else if(a==="cs"){const e=ss.L[ss.i];{const t=iso(new Date()),h=S.h[t]=S.h[t]||{s:0,r:0};h.s++;h.r+=/s$/.test(e.r)?0:parseInt(e.r)||0;save()}if(ss.set<e.s){ss.set++;rest(e.rs)}else{S.done[dk(e)]=1;const n=ss.L.findIndex(x=>!S.done[dk(x)]);if(n<0){ss.fin=1;save();sv()}else{ss.i=n;ss.set=1;save();rest(e.rs)}}}
else if(a==="skip"){clearInterval(tm);ss.rest=0;sv()}else if(a==="p15"){ss.rest+=15;ss.max+=15;sv()}else if(a==="stop")stop();
else if(a==="tg"){S.gear[v]^=1;save();render();toast("Workouts updated for your gear")}
else if(a==="rmg"){S.cg=S.cg.filter(g=>g.id!==v);delete S.gear[v];save();render()}
else if(a==="addg")addg();else if(a==="ckx")b.classList.toggle("on");
else if(a==="saveg"){const n=$("#gn").value.trim();if(!n){$("#gn").focus();return}const ex=[...document.querySelectorAll(".ck.on")].map(x=>x.dataset.v);const id="c"+Date.now();S.cg.push({id,name:n,ex});S.gear[id]=1;save();document.querySelector(".mask").remove();render();toast(n+" added — "+ex.length+" exercises unlocked")}
else if(a==="rs"){const m=ask(`<h2>Reset progress?</h2><p class="mu">This clears completed moves and your streak. This can’t be undone.</p><button class="cta" data-a="rs2">Yes, reset</button><button class="cta g" data-a="close2">Cancel</button>`)}
else if(a==="rs2"){S.done={};S.h={};save();document.querySelector(".mask").remove();render();toast("Progress reset")}
else if(a==="close2")document.querySelector(".mask").remove()};
render();
</script>
<script>
// Fitforg welcome screen: first launch shows the full welcome with a button; later launches show a brief splash.
(function(){
const sp=document.getElementById("splash"),go=document.getElementById("sp-go"),lock=["main","nav"].map(i=>document.getElementById(i));
let seen=0;try{seen=localStorage.getItem("ff_welcome")==="1"}catch(e){}
if(location.hash==="#welcome")seen=0;
lock.forEach(n=>n.inert=true);
let done=0;
function leave(){if(done)return;done=1;try{localStorage.setItem("ff_welcome","1")}catch(e){}
sp.classList.add("out");lock.forEach(n=>n.inert=false);setTimeout(()=>sp.remove(),450)}
// Remove preloader once app is ready
var pl=document.getElementById("preloader");if(pl){pl.style.opacity="0";setTimeout(function(){pl.remove()},300)}
go.onclick=leave;
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(function(){})}</script>
</body>
